<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💬 Bate-Papo - RemoteAccess</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icon_32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon_16.png">
  <style>
    :root {
      --bg: #090d16;
      --bg-card: #131b2e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    /* Header */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chat-icon {
      font-size: 1.2rem;
    }
    .chat-title {
      font-size: 0.95rem;
      font-weight: 700;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    /* Messages Body */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .chat-intro {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 0.5rem;
      padding: 0.4rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
    }
    .msg {
      max-width: 85%;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.me {
      align-self: flex-end;
      background: rgba(59, 130, 246, 0.4);
      border-bottom-right-radius: 2px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .msg.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border);
    }
    .msg-sender {
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
    }
    .msg.me .msg-sender {
      color: #93c5fd;
    }
    .msg.other .msg-sender {
      color: #86efac;
    }
    .msg-time {
      font-size: 0.65rem;
      color: var(--text-sub);
      margin-top: 0.2rem;
      text-align: right;
    }
    /* Footer Form */
    .chat-footer {
      display: flex;
      gap: 0.5rem;
      padding: 0.65rem 0.75rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }
    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus {
      border-color: var(--accent);
    }
    .btn-send {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-send:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="header-left">
      <span class="chat-icon">💬</span>
      <span class="chat-title">Bate-Papo Remoto</span>
    </div>
    <div class="status-dot" title="Conectado"></div>
  </div>

  <div id="messages" class="chat-body">
    <div class="chat-intro">Sessão de bate-papo em tempo real ativa</div>
  </div>

  <form id="chat-form" class="chat-footer" onsubmit="handleSend(event)">
    <input type="text" id="chat-input" class="chat-input" placeholder="Digite sua mensagem..." autocomplete="off" required>
    <button type="submit" class="btn-send">Enviar</button>
  </form>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('chat-input');
    const seenTexts = new Set();

    // BroadcastChannel for zero-latency communication with parent application window
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('remoteaccess_chat') : null;

    if (bc) {
      bc.onmessage = (event) => {
        const data = event.data;
        if (data && data.action === 'receive') {
          appendMessage(data.sender || 'Remoto', data.text);
        }
      };
    }

    function appendMessage(sender, text, timeStr) {
      const key = `${sender}:${text}`;
      if (seenTexts.has(key)) return;
      seenTexts.add(key);

      const isMe = (sender === 'Você' || sender.startsWith('Você'));
      
      const msgEl = document.createElement('div');
      msgEl.className = 'msg ' + (isMe ? 'me' : 'other');
      
      const time = timeStr || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      msgEl.innerHTML = `
        <div class="msg-sender">${escapeHtml(sender)}</div>
        <div class="msg-text">${escapeHtml(text)}</div>
        <div class="msg-time">${time}</div>
      `;
      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    function handleSend(e) {
      if (e) e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage('Você', text);
      inputEl.value = '';
      inputEl.focus();

      // 1. Broadcast to parent app window (which sends via WebRTC DataChannel if controller)
      if (bc) {
        bc.postMessage({ action: 'send', text: text });
      }

      // 2. Also send via local REST API endpoint (for host)
      fetch('/api/send-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      }).catch(() => {});
    }

    async function pollMessages() {
      try {
        const res = await fetch('/api/chat-messages');
        const data = await res.json();
        if (data && data.messages && data.messages.length > 0) {
          data.messages.forEach(m => {
            appendMessage(m.sender, m.text, m.time);
          });
        }
      } catch(e) {}
    }

    // Auto-focus input on load and when window gains focus
    window.addEventListener('DOMContentLoaded', () => {
      inputEl.focus();
      pollMessages();
      setInterval(pollMessages, 1000);
    });

    window.addEventListener('focus', () => {
      inputEl.focus();
    });
  </script>
</body>
</html>
